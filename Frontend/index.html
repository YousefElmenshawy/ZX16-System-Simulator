<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ZX16 IDE</title>
  <!-- Modern Icons from Lucide -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <!-- Modern web fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Favicon -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="mask-icon" href="favicon.svg" color="#007acc">
  <meta name="theme-color" content="#007acc">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Modern Typography */
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      background: #1e1e1e;
      color: #cccccc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      font-size: 13px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Light Theme */
    body.light-theme {
      background: #ffffff;
      color: #333333;
    }
    body.light-theme .top-panel {
      background: #f3f3f3;
      border-bottom: 1px solid #e5e5e5;
    }
    /* Removed unused light-theme selectors for activity bar/sidebar */
    /* body.light-theme .activity-bar { ... } */
    /* body.light-theme .activity-item { ... } */
    /* body.light-theme .activity-item:hover { ... } */
    /* body.light-theme .activity-item.active { ... } */
    /* body.light-theme .sidebar { ... } */
    /* body.light-theme .sidebar-header { ... } */
    body.light-theme .code-panel {
      background: #ffffff;
    }
    body.light-theme .code-tabs {
      background: #f3f3f3;
      border-bottom: 1px solid #e5e5e5;
    }
    body.light-theme .code-tab {
      background: transparent;
      color: #333333;
      border-right: 1px solid #e5e5e5;
    }
    body.light-theme .code-tab:hover:not(.active) {
      background: #e5e5e5;
    }
    body.light-theme .code-tab.active {
      background: #ffffff;
      color: #000000;
      border-bottom: 2px solid #007acc;
    }
    body.light-theme .new-tab-btn {
      color: #666666;
    }
    body.light-theme .new-tab-btn:hover {
      background: #e5e5e5;
      color: #333333;
    }
    body.light-theme .code-editor {
      background: #ffffff;
      color: #333333;
    }
    body.light-theme .code-editor::placeholder {
      color: #999999;
    }
    body.light-theme .line-numbers {
      background: #f8f8f8;
      color: #858585;
      border-right: 1px solid #e5e5e5;
      overflow: auto;
      -ms-overflow-style: none; /* IE and Edge */
      scrollbar-width: none; /* Firefox */
    }
    body.light-theme .line-numbers::-webkit-scrollbar { /* Chrome, Safari */
      width: 0;
      height: 0;
    }
    body.light-theme .editor-line-highlight {
      background-color: rgba(0, 122, 204, 0.1);
      border-left: 3px solid #007acc;
    }
    body.light-theme .line-count {
      background: rgba(255, 255, 255, 0.9);
      color: #333333;
      border: 1px solid #e5e5e5;
    }
    body.light-theme .registers-panel {
      background: #f8f8f8;
      border-left: 1px solid #e5e5e5;
    }
    body.light-theme .registers-header {
      background: #f3f3f3;
      border-bottom: 1px solid #e5e5e5;
      color: #333333;
    }
    body.light-theme .reg-table th {

      background: #f3f3f3;
      color: #007acc;
    }
    body.light-theme .reg-table td {
      color: #333333;
    }
    body.light-theme .reg-table tr:hover {
      background: #f0f0f0;
    }
    body.light-theme .bottom-panel {
      background: #f8f8f8;
      border-top: 1px solid #e5e5e5;
    }
    body.light-theme .bottom-tabs {
      background: #f3f3f3;
      border-bottom: 1px solid #e5e5e5;
    }
    body.light-theme .bottom-tab {
      color: #333333;
    }
    body.light-theme .bottom-tab:hover:not(.active) {
      background: #e5e5e5;
    }
    body.light-theme .bottom-tab.active {
      color: #000000;
      border-bottom-color: #007acc;
      background: #f8f8f8;
    }
    body.light-theme .console-output {
      background: #ffffff;
      color: #333333;
      border: 1px solid #e5e5e5;
    }
    body.light-theme .current-instruction {
      background-color: rgba(0, 122, 204, 0.15);
      border-left: 2px solid #007acc;
    }
    body.light-theme .memory-table th {

      background: #f3f3f3;
      color: #007acc;
    }
    body.light-theme .memory-table td {
      color: #333333;
    }
    body.light-theme .memory-table tr:hover {
      background: #f0f0f0;
    }
    body.light-theme .status-bar {
      background: #007acc;
      color: #ffffff;
    }
    body.light-theme .control-button {
      background: transparent;
      border: none;
      color: #4b5563; /* slate-600 */
      box-shadow: none;
    }
    body.light-theme .control-button:hover {
      background: transparent;
      border: none;
      color: #007acc; /* accent on hover */
      box-shadow: none;
    }
    body.light-theme .control-button:active {
      background: transparent;
      border: none;
      box-shadow: none;
    }
    body.light-theme .control-button:disabled {
      background: transparent;
      border: none;
      color: #9ca3af; /* slate-400 */
      box-shadow: none;
    }

    /* Top Panel - VSCode-like title bar */
    .top-panel {
      background: #2d2d30;
      border-bottom: 1px solid #3e3e42;
      padding: 0;
      display: flex;
      align-items: center;
      height: 35px;
      position: relative;
    }

    .ide-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.2px;
      color: #cccccc;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      height: 100%;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Better title color in light mode */
    body.light-theme .ide-title {
      color: #1f2937; /* slate-800 for crisp text on light bg */
    }

    .ide-title::before {
      content: "⚡";
      font-size: 16px;
      color: #007acc;
    }

    /* Modern Control Buttons */
    .controls-container {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      margin-right: 16px;
    }

    .control-button {
      background: transparent;
      color: #cccccc;
      border: none;
      border-radius: 6px;
      padding: 0;
      width: 34px;
      height: 34px;
      justify-content: center;
      gap: 0;
      position: relative;
      transition: all 0.15s ease;
    }
    #run-btn,
    #run-btn:hover,
    #run-btn:disabled { color: #22c55e; } /* emerald-500 */
    /* Make the run icon a filled triangle */
    #run-btn svg path,
    #run-btn svg polygon {  }

    /* Step controls = blue */
    #step-mode-btn,
    #step-mode-btn:hover,
    #step-mode-btn:disabled,
    #step-btn,
    #step-btn:hover,
    #step-btn:disabled { color: #3b82f6; } /* blue-500 */


    /* Icon size inside buttons */
    .control-button i[data-lucide] {
      width: 18px !important;
      height: 18px !important;
    }

    /* Tooltip on hover using data-label */
    .control-button::after {
      content: attr(data-label);
      position: absolute;
      top: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 4px 8px;
      font-size: 12px;
      border-radius: 4px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.12s ease;
      z-index: 10;
    }
    .control-button:hover::after {
      opacity: 1;
    }

    /* Improve hover/active visuals */
    .control-button:hover {
      background: #3e3e42;
      color: #ffffff;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.06) inset;
    }
    .control-button:active {
      transform: translateY(0.5px);
    }

    /* Main Content Area */
    .main-content {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    .editor-area {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    /* Code Panel */
    .code-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #1e1e1e;
      min-width: 400px;
    }

    /* Modern Tabs */
    .code-tabs {
      display: flex;
      background: #2d2d30;
      border-bottom: 1px solid #3e3e42;
      overflow-x: auto;
      min-height: 35px;
    }

    .code-tab {
      display: flex;
      align-items: center;
      background: transparent;
      border: none;
      color: #cccccc;
      padding: 0;
      font-size: 13px;
      cursor: pointer;
      border-right: 1px solid #3e3e42;
      white-space: nowrap;
      min-width: 120px;
      max-width: 200px;
      position: relative;
      height: 35px;
      transition: all 0.15s ease;
    }

    .code-tab:hover:not(.active) {
      background: #3e3e42;
    }

    .code-tab.active {
      background: #1e1e1e;
      color: #ffffff;
      border-bottom: 2px solid #007acc;
    }

    .code-tab.dirty::after {
      content: '●';
      color: #ffffff;
      margin-left: 4px;
      font-size: 12px;
    }

    .tab-content {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 12px;
      flex: 1;
      min-width: 0;
    }

    .tab-icon {
      width: 16px;
      height: 16px;
      opacity: 0.7;
    }

    .tab-name-container {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 1;
      min-width: 0;
    }

    .tab-name {
      flex: 1;
      background: transparent;
      border: none;
      color: inherit;
      font-size: inherit;
      font-family: inherit;
      outline: none;
      padding: 0;
      cursor: pointer;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tab-name:focus {
      cursor: text;
    }

    .tab-extension {
      color: #858585;
      font-size: 12px;
      white-space: nowrap;
    }

    .tab-close {
      background: none;
      border: none;
      color: #858585;
      font-size: 12px;
      cursor: pointer;
      padding: 2px;
      border-radius: 2px;
      line-height: 1;
      opacity: 0;
      transition: all 0.15s ease;
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .code-tab:hover .tab-close {
      opacity: 1;
    }

    .tab-close:hover {
      background: #5a5a5a;
      color: #ffffff;
    }

    .new-tab-btn {
      background: transparent;
      border: none;
      color: #858585;
      font-size: 16px;
      cursor: pointer;
      padding: 0 12px;
      transition: all 0.15s ease;
      height: 35px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .new-tab-btn:hover {
      background: #3e3e42;
      color: #cccccc;
    }

    /* Code Editor */
    .code-content {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .editor-container {
      position: relative;
      height: 100%;
      overflow: hidden;
    }

    .code-editor {
      position: absolute;
      top: 0;
      left: 40px;
      right: 0;
      bottom: 0;
      border: none;
      background: #1e1e1e;
      color: #d4d4d4;
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', 'Monaco', monospace;
      font-size: 14px;
      line-height: 20px;
      padding: 16px;
      resize: none;
      outline: none;
      display: none;
      white-space: pre;
      overflow: auto;
      tab-size: 2;
      /* Remove transparency for better text rendering */
      z-index: 1;
    }

    .code-editor.active {
      display: block;
    }

    .code-editor::placeholder {
      color: #6a6a6a;
    }

    /* Syntax highlighting content div - replaces overlay */
    .syntax-content {
      position: absolute;
      top: 0;
      left: 40px;
      right: 0;
      bottom: 0;
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', 'Monaco', monospace;
      font-size: 14px;
      line-height: 20px;
      padding: 16px;
      margin: 0;
      border: none;
      white-space: pre;
      overflow: hidden; /* Don't scroll independently */
      background: transparent;
      color: #d4d4d4;
      pointer-events: none;
      z-index: 2;
      display: none;
      /* Force exact positioning match */
      box-sizing: border-box;
      tab-size: 2; /* Ensure tabs render same width as the textarea to align caret */
    }

    /* Hide the textarea when syntax highlighting is active */
    .editor-container.syntax-active .code-editor {
      color: transparent;
      caret-color: #d4d4d4;
    }

    /* Line Numbers */
    .line-numbers {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 40px;
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', 'Monaco', monospace;
      font-size: 14px;
      line-height: 20px;
      color: #858585;
      text-align: right;
      padding: 16px 8px 16px 0;
      background: #1e1e1e;
      user-select: none;
      border-right: 1px solid #3e3e42;
      white-space: pre;
      overflow: auto;
      -ms-overflow-style: none; /* IE and Edge */
      scrollbar-width: none; /* Firefox */
    }
    .line-numbers::-webkit-scrollbar { /* Chrome, Safari */
      width: 0;
      height: 0;
    }

    /* Registers Panel */
    .registers-panel {
      width: 300px;
      background: #252526;
      border-left: 1px solid #3e3e42;
      display: flex;
      flex-direction: column;
    }

    .registers-header {
      background: #2d2d30;
      padding: 8px 16px;
      border-bottom: 1px solid #3e3e42;
      font-size: 11px;
      font-weight: 600;
      color: #cccccc;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .registers-content {
      flex: 1;
      overflow-y: auto;
      padding: 0;
    }

    .reg-table {
      width: 100%;
      border-collapse: collapse;
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', 'Monaco', monospace;
      font-size: 12px;
    }

    .reg-table th,
    .reg-table td {
      padding: 8px 16px;
      text-align: left;
      border-bottom: 1px solid #3e3e42;
    }

    .reg-table th {
      background: #2d2d30;
      color: #007acc;
      font-weight: 600;
      position: sticky;
      top: 0;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .reg-table td {
      color: #d4d4d4;
    }

    .reg-table tr:hover {
      background: #2a2a2b;
    }

    /* Bottom Panel */
    .bottom-panel {
      height: 250px;
      background: #252526;
      border-top: 1px solid #3e3e42;
      display: flex;
      flex-direction: column;
    }

    .bottom-tabs {
      display: flex;
      background: #2d2d30;
      border-bottom: 1px solid #3e3e42;
      gap: 1px;
    }

    .bottom-tab {
      background: transparent;
      border: none;
      color: #cccccc;
      padding: 8px 16px;
      font-size: 13px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: inherit;
    }

    .bottom-tab:hover:not(.active) {
      background: #3e3e42;
    }

    .bottom-tab.active {
      color: #ffffff;
      border-bottom-color: #007acc;
      background: #252526;
    }

    .bottom-content {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .tab-panel {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 16px;
      overflow-y: auto;
      display: none;
    }

    .tab-panel.active {
      display: block;
    }

    .console-output {
      background: #1e1e1e;
      border: 1px solid #3e3e42;
      border-radius: 3px;
      padding: 12px;
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', 'Monaco', monospace;
      font-size: 13px;
      color: #d4d4d4;
      white-space: pre-wrap;
      min-height: 180px;
      overflow-y: auto;
    }

    .memory-table {
      width: 100%;
      border-collapse: collapse;
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', 'Monaco', monospace;
      font-size: 12px;
    }

    .memory-table th,
    .memory-table td {
      padding: 6px 16px;
      text-align: left;
      border-bottom: 1px solid #3e3e42;
    }

    .memory-table th {
      background: #2d2d30;
      color: #007acc;
      font-weight: 600;
      position: sticky;
      top: 0;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .memory-table td {
      color: #d4d4d4;
    }

    .memory-table tr:hover {
      background: #2a2a2b;
    }

    /* Status Bar */
    /*
    .status-bar {
      height: 22px;
      background: #007acc;
      color: #ffffff;
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-size: 12px;
      gap: 16px;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    */

    /* Line Count Display */
    .line-count {
      position: absolute;
      bottom: 4px;
      right: 4px;
      background: rgba(0, 0, 0, 0.7);
      color: #ffffff;
      padding: 2px 6px;
      font-size: 11px;
      border-radius: 2px;
      z-index: 3;
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', 'Monaco', monospace;
    }

    /* Animations */
    .reg-changed {
      animation: highlight-fade 2s ease-out;
    }

    .current-instruction {
      background-color: rgba(0, 122, 204, 0.15);
      border-left: 2px solid #007acc;
      padding-left: 5px;
    }

    @keyframes highlight-fade {
      0% { background-color: rgba(255, 193, 7, 0.3); }
      100% { background-color: transparent; }
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-track {
      background: #1e1e1e;
    }

    ::-webkit-scrollbar-thumb {
      background: #424242;
      border-radius: 5px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #4f4f4f;
    }

    body.light-theme ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }

    body.light-theme ::-webkit-scrollbar-thumb {
      background: #c1c1c1;
    }

    body.light-theme ::-webkit-scrollbar-thumb:hover {
      background: #a8a8a8;
    }

    /* Syntax highlighting colors */
    .syntax-r-type { color: #569cd6; } /* R-Type instructions - blue */
    .syntax-i-type { color: #4ec9b0; } /* I-Type instructions - cyan */
    .syntax-b-type { color: #c586c0; } /* B-Type instructions - purple */
    .syntax-s-type { color: #ce9178; } /* S-Type instructions - orange */
    .syntax-l-type { color: #dcdcaa; } /* L-Type instructions - yellow */
    .syntax-j-type { color: #9cdcfe; } /* J-Type instructions - light blue */
    .syntax-u-type { color: #b5cea8; } /* U-Type instructions - light green */
    .syntax-sys-type { color: #f44747; } /* SYS-Type instructions - red */
    .syntax-pseudo { color: #d7ba7d; } /* Pseudo instructions - tan */
    .syntax-register { color: #9cdcfe; } /* Registers - light blue */
    .syntax-immediate { color: #b5cea8; } /* Immediate values - light green */
    .syntax-string { color: #ce9178; } /* String literals - orange */
    .syntax-label { color: #dcdcaa; } /* Labels - yellow */
    .syntax-comment { color: #6a9955; } /* Comments - green */
    .syntax-directive { color: #c586c0; } /* Directives - purple */

    /* Light theme syntax colors */
    body.light-theme .syntax-r-type { color: #0000ff; }
    body.light-theme .syntax-i-type { color: #008080; }
    body.light-theme .syntax-b-type { color: #800080; }
    body.light-theme .syntax-s-type { color: #a31515; }
    body.light-theme .syntax-l-type { color: #795e26; }
    body.light-theme .syntax-j-type { color: #0070c1; }
    body.light-theme .syntax-u-type { color: #267f99; }
    body.light-theme .syntax-sys-type { color: #a31515; }
    body.light-theme .syntax-pseudo { color: #795e26; }
    body.light-theme .syntax-register { color: #0070c1; }
    body.light-theme .syntax-immediate { color: #09885a; }
    body.light-theme .syntax-string { color: #a31515; }
    body.light-theme .syntax-label { color: #795e26; }
    body.light-theme .syntax-comment { color: #008000; }
    body.light-theme .syntax-directive { color: #800080; }

    /* Editor layout helpers for settings */
    body.hide-line-numbers .line-numbers { display: none !important; }
    body.hide-line-numbers .code-editor { left: 0 !important; }
    body.hide-line-numbers .highlight-overlay { left: 0 !important; margin-left: 0 !important; padding-left: 0 !important; }
    body.wrap-enabled .code-editor { white-space: pre-wrap !important; }

    /* Removed Settings compact UI and toggle switch CSS (unused) */

    /* Editor line highlighting for step mode */
    .editor-line-highlight {
      position: absolute;
      left: 40px;
      right: 0;
      background-color: rgba(86, 156, 214, 0.1);
      border-left: 3px solid #569cd6;
      pointer-events: none;
      z-index: 2;
      transition: all 0.3s ease;
      animation: highlightPulse 1s ease-in-out;
    }

    @keyframes highlightPulse {
      0% { background-color: rgba(86, 156, 214, 0.3); }
      100% { background-color: rgba(86, 156, 214, 0.1); }
    }

    /* Light theme support */
    body.light-theme .editor-line-highlight {
      background-color: rgba(0, 122, 204, 0.1);
      border-left: 3px solid #007acc;

    /* Console Input Interface for ECALL services */
    .console-input-container {
      margin-top: 12px;
      background: #2d2d30;
      border: 1px solid #3e3e42;
      border-radius: 4px;

    .input-prompt {

    .input-area {
      display: flex;
      gap: 8px;
      align-items: center;

    .console-input {
      flex: 1;
      background: #1e1e1e;
      border: 1px solid #3e3e42;
      border-radius: 3px;

      font-size: 13px;

      transition: border-color 0.15s ease;
    }

    .console-input:focus {
      border-color: #007acc;
      box-shadow: 0 0 0 1px #007acc;
    }

    .console-submit-btn, .console-cancel-btn {
      background: #007acc;
      border: none;
      border-radius: 3px;
      color: #ffffff;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .console-submit-btn:hover {
      background: #005a9e;
    }

    .console-cancel-btn {
      background: #6c757d;
    }

    .console-cancel-btn:hover {
      background: #545b62;
    }

    .console-submit-btn:active, .console-cancel-btn:active {
      transform: translateY(0.5px);
    }

    /* Light theme styles for console input */
    body.light-theme .console-input-container {
      background: #f8f8f8;
      border: 1px solid #e5e5e5;
    }

    body.light-theme .input-prompt {
      color: #795e26;
    }

    body.light-theme .console-input {
      background: #ffffff;
      border: 1px solid #e5e5e5;
      color: #333333;
    }

    body.light-theme .console-input:focus {
      border-color: #007acc;
      box-shadow: 0 0 0 1px #007acc;
    }

    /* Inline console prompt inside console area */
    .console-prompt {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', 'Monaco', monospace;
      font-size: 13px;
      color: #d4d4d4;
    }
    .console-prompt .prompt-label { color: #9ca3af; user-select: none; }
    .console-prompt-input {
      min-width: 12px;
      outline: none;
      border: none;
      padding: 2px 4px;
      background: transparent;
      color: inherit;
      border-bottom: 1px dashed #3e3e42;
    }
    .console-prompt-input:focus { border-bottom-color: #007acc; }
    body.light-theme .console-prompt { color: #333333; }
    body.light-theme .console-prompt .prompt-label { color: #6b7280; }
    body.light-theme .console-prompt-input { border-bottom-color: #e5e7eb; }
    body.light-theme .console-prompt-input:focus { border-bottom-color: #007acc; }

    /* Keep syntax overlay visually in sync with the textarea (caret alignment with tabs) */
    .syntax-content {
      position: absolute;
      top: 0;
      left: 40px;
      right: 0;
      bottom: 0;
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', 'Monaco', monospace;
      font-size: 14px;
      line-height: 20px;
      padding: 16px;
      margin: 0;
      border: none;
      white-space: pre;
      overflow: hidden; /* Don't scroll independently */
      background: transparent;
      color: #d4d4d4;
      pointer-events: none;
      z-index: 2;
      display: none;
      /* Force exact positioning match */
      box-sizing: border-box;
      tab-size: 2; /* Ensure tabs render same width as the textarea to align caret */
    }
  </style>
</head>

<script>
  // Initialize Lucide icons
  lucide.createIcons();

  // Global variables for tab management
  let tabCounter = 1;
  let activeTabId = 0;

  // Add a flag to track if we're in step mode
  let isStepMode = false;
  // Add a flag to track ECALL input waiting state (prevents stepping while simulator awaits input)
  let awaitingEcall = false;
  // NEW: track if normal Run mode is active (program running)
  let isRunModeActive = false;

  // Add PC mapping for editor lines
  let lineToPCMap = new Map();
  let currentPC = 0x0002;

  // Session counters for console history
  let runSession = 0;
  let stepSession = 0;

  // Persistent settings
  const SETTINGS_KEY = 'zx16_settings';
  const defaultSettings = { theme: 'dark', fontSize: 14, tabSize: 2, lineNumbers: true, wordWrap: false };
  let settings = { ...defaultSettings };

  function loadSettings() {
    try { const raw = localStorage.getItem(SETTINGS_KEY); if (raw) settings = { ...defaultSettings, ...JSON.parse(raw) }; } catch {}
  }
  function saveSettings() { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch {} }

  function applySettings() {
    // Theme
    const light = settings.theme === 'light';
    document.body.classList.toggle('light-theme', light);
    // Icon for theme button
    setThemeIcon(light);
    // Line numbers
    document.body.classList.toggle('hide-line-numbers', !settings.lineNumbers || settings.wordWrap);
    // Word wrap (forces hiding line numbers)
    document.body.classList.toggle('wrap-enabled', !!settings.wordWrap);
    // Font size and tab size
    document.querySelectorAll('.code-editor').forEach(ed => {
      ed.style.fontSize = settings.fontSize + 'px';
      // Approximate line-height for readability
      ed.style.lineHeight = Math.round(settings.fontSize * 1.43) + 'px';
      ed.style.tabSize = String(settings.tabSize);
      ed.style.whiteSpace = settings.wordWrap ? 'pre-wrap' : 'pre';
    });
    document.querySelectorAll('.syntax-content').forEach(ov => {
      ov.style.fontSize = settings.fontSize + 'px';
      ov.style.lineHeight = Math.round(settings.fontSize * 1.43) + 'px';
      ov.style.tabSize = String(settings.tabSize);
      ov.style.whiteSpace = settings.wordWrap ? 'pre-wrap' : 'pre';
    });
    updateLineNumbers();
    updateLineCount();
    addScrollSynchronization();
    saveSettings();
    initializeThemeButton();
  }

  // Tab creation function
  function createNewTab() {
    const tabId = tabCounter++;
    const tabName = `file${tabId}`;  // Remove .zx16 extension

    // Create tab element
    const tabsContainer = document.getElementById('code-tabs');
    const newTabBtn = tabsContainer.querySelector('.new-tab-btn');

    const tabElement = document.createElement('div');
    tabElement.className = 'code-tab';
    tabElement.dataset.tabId = tabId;
    tabElement.innerHTML = `
      <div class="tab-content">
        <i data-lucide="file-text" class="tab-icon" style="width: 16px; height: 16px;"></i>
        <span class="tab-name-container">
          <input type="text" class="tab-name" value="${tabName}">
          <span class="tab-extension">.s</span>
        </span>
        <button class="tab-close" onclick="closeTab(${tabId})">×</button>
      </div>
    `;

    // Insert before the new tab button
    tabsContainer.insertBefore(tabElement, newTabBtn);

    // Create editor elements
    const codeContent = document.querySelector('.code-content .editor-container');

    // Line numbers
    const lineNumbersElement = document.createElement('div');
    lineNumbersElement.className = 'line-numbers';
    lineNumbersElement.id = `line-numbers-${tabId}`;
    lineNumbersElement.style.display = 'none';
    codeContent.appendChild(lineNumbersElement);

    // Editor
    const editorElement = document.createElement('textarea');
    editorElement.className = 'code-editor';
    editorElement.id = `editor-${tabId}`;
    editorElement.placeholder = '# Enter your ZX16 assembly code here';
    editorElement.setAttribute('spellcheck', 'false');
    codeContent.appendChild(editorElement);

    // Syntax content
    const syntaxContentElement = document.createElement('div');
    syntaxContentElement.className = 'syntax-content';
    syntaxContentElement.id = `syntax-content-${tabId}`;
    syntaxContentElement.style.display = 'none';
    codeContent.appendChild(syntaxContentElement);

    // Re-initialize icons for new tab
    lucide.createIcons();

    // Add click handler to tab
    tabElement.addEventListener('click', (e) => {
      if (!e.target.classList.contains('tab-name') && !e.target.classList.contains('tab-close')) {
        switchTab(tabId);
      }
    });

    // Add editing functionality to tab name
    const tabNameInput = tabElement.querySelector('.tab-name');
    setupTabNameEditing(tabNameInput, tabName);

    // Switch to new tab
    switchTab(tabId);
  }

  // Setup tab name editing functionality
  function setupTabNameEditing(tabNameInput, defaultName) {
    tabNameInput.removeAttribute('readonly');
    tabNameInput.addEventListener('blur', () => {
      if (tabNameInput.value.trim() === '') {
        tabNameInput.value = defaultName;
      }
    });
    tabNameInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        tabNameInput.blur();
      }
    });
    tabNameInput.addEventListener('click', (e) => {
      e.stopPropagation();
      const tabId = parseInt(tabNameInput.closest('.code-tab').dataset.tabId);
      switchTab(tabId);
    });
  }

  // Tab switching function
  function switchTab(tabId) {
    // Remove active class from all tabs and editors
    document.querySelectorAll('.code-tab').forEach(tab => {
      tab.classList.remove('active');
    });
    document.querySelectorAll('.code-editor').forEach(editor => {
      editor.classList.remove('active');
      editor.style.display = 'none';
    });
    document.querySelectorAll('.line-numbers').forEach(lineNum => {
      lineNum.style.display = 'none';
    });
    document.querySelectorAll('.syntax-content').forEach(overlay => {
      overlay.style.display = 'none';
    });

    // Add active class to selected tab and editor
    const selectedTab = document.querySelector(`[data-tab-id="${tabId}"]`);
    const selectedEditor = document.getElementById(`editor-${tabId}`);
    const selectedLineNumbers = document.getElementById(`line-numbers-${tabId}`);
    const selectedOverlay = document.getElementById(`syntax-content-${tabId}`);

    if (selectedTab && selectedEditor) {
      selectedTab.classList.add('active');
      selectedEditor.classList.add('active');
      selectedEditor.style.display = 'block';
      if (selectedLineNumbers) selectedLineNumbers.style.display = 'block';
      if (selectedOverlay) selectedOverlay.style.display = 'block';
      activeTabId = tabId;

      // Highlight current line in step mode when switching tabs
      if (isStepMode && window._lastStepData && (window._lastStepData.current_instruction || window._lastStepData.current_pc !== null)) {
        highlightInstructionInEditor(window._lastStepData.current_instruction, window._lastStepData.current_pc);
      } else {
        clearEditorHighlight();
      }
      updateLineCount();
      updateLineNumbers();
      addScrollSynchronization();
    }
  }

  // Tab closing function
  function closeTab(tabId) {
    const tabElement = document.querySelector(`[data-tab-id="${tabId}"]`);
    const editorElement = document.getElementById(`editor-${tabId}`);
    const lineNumbersElement = document.getElementById(`line-numbers-${tabId}`);
    const overlayElement = document.getElementById(`syntax-content-${tabId}`);

    if (!tabElement || !editorElement) return;

    // Don't close if it's the last tab
    const allTabs = document.querySelectorAll('.code-tab');
    if (allTabs.length <= 1) {
      alert('Cannot close the last tab!');
      return;
    }

    // If closing the active tab, switch to another tab first
    if (activeTabId === tabId) {
      const otherTabs = Array.from(allTabs).filter(tab =>
              parseInt(tab.dataset.tabId) !== tabId
      );

      if (otherTabs.length > 0) {
        const nextTabId = parseInt(otherTabs[0].dataset.tabId);
        switchTab(nextTabId);
      }
    }

    // Remove tab and editor elements
    tabElement.remove();
    editorElement.remove();
    if (lineNumbersElement) lineNumbersElement.remove();
    if (overlayElement) overlayElement.remove();
  }

  // Get active editor content
  function getActiveEditorContent() {
    const activeEditor = document.querySelector('.code-editor.active');
    return activeEditor ? activeEditor.value : '';
  }

  // Update line numbers
  function updateLineNumbers() {
    const activeEditor = document.querySelector('.code-editor.active');
    const activeLineNumbers = document.querySelector(`#line-numbers-${activeTabId}`);

    if (activeEditor && activeLineNumbers) {
      const lines = activeEditor.value.split('\n');
      const lineCount = lines.length;
      let lineNumbersHTML = '';

      for (let i = 1; i <= lineCount; i++) {
        lineNumbersHTML += i + '\n';
      }

      // Remove the last newline to prevent extra spacing
      lineNumbersHTML = lineNumbersHTML.slice(0, -1);
      activeLineNumbers.textContent = lineNumbersHTML;
    }
  }

  // Keep line numbers scrolled with editor content (while staying pinned left)
  function syncLineNumbersScroll() {
    const activeEditor = document.querySelector('.code-editor.active');
    const activeLineNumbers = document.querySelector(`#line-numbers-${activeTabId}`);
    const activeOverlay = document.querySelector(`#syntax-content-${activeTabId}`);

    if (activeEditor && activeLineNumbers) {
      activeLineNumbers.scrollTop = activeEditor.scrollTop;
      activeLineNumbers.scrollLeft = 0; // Keep line numbers pinned left
    }

    // Sync syntax highlighting overlay with editor scroll - BOTH vertical AND horizontal
    if (activeEditor && activeOverlay) {
      activeOverlay.scrollTop = activeEditor.scrollTop;
      activeOverlay.scrollLeft = activeEditor.scrollLeft; // This was missing!
    }
  }

  function addScrollSynchronization() {
    const activeEditor = document.querySelector('.code-editor.active');
    const activeLineNumbers = document.querySelector(`#line-numbers-${activeTabId}`);

    if (activeEditor && activeLineNumbers) {
      // Avoid duplicate listeners
      activeEditor.removeEventListener('scroll', syncLineNumbersScroll);
      activeEditor.addEventListener('scroll', syncLineNumbersScroll);
      // Initial sync
      syncLineNumbersScroll();
    }
  }

  // Tab switching for bottom panel
  document.querySelectorAll('.bottom-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      // Remove active class from all tabs and panels
      document.querySelectorAll('.bottom-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));

      // Add active class to clicked tab and corresponding panel
      tab.classList.add('active');
      document.getElementById(tab.dataset.tab + '-panel').classList.add('active');
    });
  });

  // Append to console like a terminal (insert above prompt if present)
  function appendToConsole(text) {
    const consoleOutput = document.getElementById('console-output');
    if (!text) return;
    const promptEl = consoleOutput.querySelector('.console-prompt');
    const lines = ('' + text).split('\n');
    for (const line of lines) {
      const div = document.createElement('div');
      div.textContent = line;
      if (promptEl) {
        consoleOutput.insertBefore(div, promptEl);
      } else {
        consoleOutput.appendChild(div);
      }
    }
    // Auto scroll to bottom
    consoleOutput.scrollTop = consoleOutput.scrollHeight;
  }

  function sessionHeader(mode, id) {
    const now = new Date();
    const ts = now.toLocaleTimeString();
    return `\n——— ${mode} Session #${id} — ${ts} ———`;
  }

  // Update IDE state
  async function updateIDE(data) {
    window._lastStepData = data;
    console.log("[Debug] updateIDE called with data:", data);

    // Determine if simulation ended as early as possible
    const simulationEnded = !!(data && (data.simulationEnded || (data.output && data.output.includes("Simulation ended"))));

    // If simulation ended, clear any lingering ECALL prompts before anything else
    if (simulationEnded) {
      try { hideInputInterface(); } catch {}
      try { hideConsolePrompt(); } catch {}
      awaitingEcall = false;
    }

    // Only check for ECALL prompts if simulation is not ended
    if (!simulationEnded && data.output) {
      checkForEcallInput(data.output);
    }

    // Update console output: APPEND instead of clearing
    const consoleOutput = document.getElementById("console-output");

    // Check if we have input prompts
    const hasPrompt = (document.getElementById('console-input-container').style.display !== 'none') || !!document.querySelector('#console-output .console-prompt');
    const isAwaiting = awaitingEcall || hasPrompt;

    // IMPROVED: Get mode from backend response to properly manage button states
    const currentMode = data.mode || (isStepMode ? 'step' : 'run');

    // Handle button states based on current mode and simulation state
    if (simulationEnded) {
      // Simulation has ended - reset all buttons to normal state
      setButtonState('run-btn', 'play', 'Run', false);
      setButtonState('step-mode-btn', 'step-forward', 'Step Mode', false);
      setButtonState('step-btn', 'check', 'Step (Done)', true);

      // Reset mode flags when simulation ends
      isStepMode = false;
      awaitingEcall = false;
      isRunModeActive = false;

      // Ensure no prompt elements linger in the UI after end
      try { hideInputInterface(); } catch {}
      try { hideConsolePrompt(); } catch {}
    } else if (isAwaiting) {
      // Waiting for ECALL input - handle based on active mode
      if (currentMode === 'step' || isStepMode) {
        setButtonState('run-btn', 'play', 'Run', true);
        setButtonState('step-mode-btn', 'pause', 'Step Mode Active', true);
        setButtonState('step-btn', 'pause', 'Waiting for input…', true);
      } else {
        // In run mode waiting for input - keep RUN as square and clickable to stop
        setButtonState('run-btn', 'square', 'Stop', false);
        setButtonState('step-mode-btn', 'step-forward', 'Step Mode', true);
        setButtonState('step-btn', 'pause', 'Waiting for input…', true);
        isRunModeActive = true;
      }
    } else {
      // Normal execution state
      if (currentMode === 'step' || isStepMode) {
        setButtonState('run-btn', 'play', 'Run', true);
        setButtonState('step-mode-btn', 'pause', 'Step Mode Active', false);
        setButtonState('step-btn', 'skip-forward', 'Step', false);
      } else {
        // RUN mode active: keep square and make it clickable to stop
        setButtonState('run-btn', 'square', 'Stop', false);
        setButtonState('step-mode-btn', 'step-forward', 'Step Mode', true);
        setButtonState('step-btn', 'skip-forward', 'Step', true);
        isRunModeActive = true;
      }
    }

    let currentInstructionText = null;
    let currentPC = null;
    if (data.output) {
      const lines = data.output.split('\n');
      if ('current_pc' in data && data.current_pc !== null && data.current_pc !== undefined) {
        if (typeof data.current_pc === "string") {
          currentPC = parseInt(data.current_pc, 16);
        } else {
          currentPC = data.current_pc;
        }
      }
      if ('current_instruction' in data && data.current_instruction) {
        currentInstructionText = data.current_instruction;
      }
      if (currentPC === null || currentInstructionText === null) {
        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];
          if (line.match(/^\[\w+\]\s+0x\w+\s+\w+/)) {
            const instMatch = line.match(/(?:\[\w+\]\s+0x\w+\s+)(.+)$/);
            if (instMatch && instMatch[1]) {
              currentInstructionText = instMatch[1].trim();
              if (i + 1 < lines.length && lines[i + 1].includes("Executed:")) {
                const pcMatch = line.match(/^\[(\w+)\]/);
                if (pcMatch) {
                  currentPC = parseInt(pcMatch[1], 16);
                }
                break;
              }
            }
          }
        }
      }
      // Append new output lines
      appendToConsole(data.output);
    }

    // Update registers with highlighting
    const regTableBody = document.getElementById("reg-table").querySelector("tbody");
    regTableBody.innerHTML = "";

    if (data.registers) {
      const changedRegs = data.changed_registers || [];

      Object.entries(data.registers).forEach(([reg, val]) => {
        const row = document.createElement("tr");
        if (changedRegs.includes(reg)) {
          row.classList.add("reg-changed");
        }
        let signedVal = val;
        if (typeof signedVal === "string") signedVal = parseInt(signedVal, 10);
        if (signedVal > 32767) signedVal -= 65536;
        row.innerHTML = `<td>${reg}</td><td>${signedVal} <span style="color:#888;">(0x${(val & 0xFFFF).toString(16).padStart(4, '0')})</span></td>`;
        regTableBody.appendChild(row);
      });
    }

    // Update memory (independent of registers)
    const memTableBody = document.getElementById("memory-table").querySelector("tbody");
    memTableBody.innerHTML = "";
    if (data.memory && data.memory.length > 0) {
      data.memory.forEach((memRow, index) => {
        const row = document.createElement("tr");
        const bytesFormatted = memRow.bytes.map(b => b.toString(16).padStart(2, '0')).join(' ');
        row.innerHTML = `<td>${memRow.address}</td><td>${bytesFormatted}</td>`;
        memTableBody.appendChild(row);
      });
    }

    // Update instruction log (independent of registers)
    const instructionsTableBody = document.getElementById("instructions-table").querySelector("tbody");
    instructionsTableBody.innerHTML = "";
    if (data.instruction_log && data.instruction_log.length > 0) {
      data.instruction_log.forEach((inst, index) => {
        const row = document.createElement("tr");
        // Check if this is the current instruction being executed
        const isCurrentInstruction = (isStepMode && inst.pc === data.current_pc);
        if (isCurrentInstruction) {
          row.classList.add("current-instruction");
        }
        row.innerHTML = `<td>${inst.step || index + 1}</td><td>0x${inst.pc}</td><td>${escapeHtml(inst.instruction)}</td>`;
        instructionsTableBody.appendChild(row);
      });

      // Auto-scroll to the latest instruction
      if (data.instruction_log.length > 0) {
        const table = document.getElementById("instructions-table");
        const tableContainer = table.closest('.tab-panel');
        if (tableContainer) {
          tableContainer.scrollTop = tableContainer.scrollHeight;
        }
      }
    }

    // Handle highlighting in the editor (independent of registers)
    if (isStepMode && !simulationEnded && currentPC !== null) {
      console.log("Highlighting instruction at PC:", currentPC);
      highlightInstructionInEditor(window._lastStepData.current_instruction, currentPC);
    } else {
      clearEditorHighlight();
    }

    // Re-initialize icons after content update
    lucide.createIcons();
  }

  // Highlight instruction in editor using program counter
  function highlightInstructionInEditor(currentInstruction, currentPC) {
    if (!isStepMode || currentPC === null || currentPC === undefined) return;

    const editor = document.querySelector('.code-editor.active');
    if (!editor) return;

    clearEditorHighlight();

    // Convert currentPC to number if it's a hex string
    const pcValue = typeof currentPC === 'string' ? parseInt(currentPC, 16) : currentPC;

    // Find the line that matches the current PC
    let actualLineNumber = null;
    for (const [lineNum, pc] of lineToPCMap.entries()) {
      // Convert both to hex strings for comparison to avoid number type issues
      if (pc.toString(16) === pcValue.toString(16)) {
        actualLineNumber = parseInt(lineNum);
        break;
      }
    }

    console.log("Current PC:", pcValue.toString(16), "Matched line:", actualLineNumber, "PC Map:", [...lineToPCMap.entries()].map(([line, pc]) => [line, pc.toString(16)]));

    if (actualLineNumber === null) return;

    // Create highlight element
    const highlight = document.createElement('div');
    highlight.className = 'editor-line-highlight';

    // Calculate position
    const lineHeight = parseInt(getComputedStyle(editor).lineHeight);
    const paddingTop = parseInt(getComputedStyle(editor).paddingTop);

    highlight.style.top = `${paddingTop + lineHeight * actualLineNumber}px`;
    highlight.style.height = `${lineHeight}px`;
    editor.parentElement.appendChild(highlight);

    // Scroll into view if needed
    const editorRect = editor.getBoundingClientRect();
    const highlightTop = paddingTop + lineHeight * actualLineNumber;
    const highlightBottom = highlightTop + lineHeight;

    if (highlightTop < editor.scrollTop || highlightBottom > editor.scrollTop + editorRect.height) {
        editor.scrollTop = highlightTop - editorRect.height / 2;
    }
  }

  // Calculate match score between two normalized instruction strings
  function calculateMatchScore(inst1, inst2) {
    const words1 = inst1.split(' ');
    const words2 = inst2.split(' ');
    let score = 0;

    // Score based on matching words
    for (let i = 0; i < Math.min(words1.length, words2.length); i++) {
      if (words1[i] === words2[i]) {
        score += (words1.length - i); // Earlier matches get higher scores
      }
    }

    return score;
  }

  // Syntax highlighting for ZX16 assembly
  function highlightSyntax() {
    const activeEditor = document.querySelector('.code-editor.active');
    const activeOverlay = document.querySelector(`#syntax-content-${activeTabId}`);

    if (!activeEditor || !activeOverlay) return;

    const code = activeEditor.value;
    const lines = code.split('\n');

    // Clear previous highlighting
    activeOverlay.innerHTML = '';

    // Create highlighted content
    let highlightedContent = '';

    lines.forEach((line, lineIndex) => {
      const highlightedLine = highlightLine(line);
      highlightedContent += highlightedLine + '\n';
    });

    // Remove the last newline
    highlightedContent = highlightedContent.slice(0, -1);
    activeOverlay.innerHTML = highlightedContent;

    // Enable syntax-active mode to make editor text transparent
    const editorContainer = activeEditor.parentElement;
    if (editorContainer) {
      editorContainer.classList.add('syntax-active');
    }

    // Immediately sync scroll positions to prevent offset issues
    syncLineNumbersScroll();
  }

  function highlightLine(line) {
    // Handle comments first (everything after #)
    const commentIndex = line.indexOf('#');
    let codePartOriginal = commentIndex !== -1 ? line.substring(0, commentIndex) : line;
    let commentPart = commentIndex !== -1 ? line.substring(commentIndex) : '';

    let codePart = codePartOriginal;

    // Handle labels (text followed by colon)
    const labelMatch = codePart.match(/^(\s*)([a-zA-Z_][a-zA-Z0-9_]*)\s*:\s*(.*)/);
    if (labelMatch) {
      const [, leadingWhitespace, labelName, restOfLine] = labelMatch;
      const highlightedLabel = `${leadingWhitespace}<span class="syntax-label">${labelName}:</span> `;
      const highlightedRest = highlightCodeTokens(restOfLine);
      const highlightedComment = commentPart ? `<span class="syntax-comment">${escapeHtml(commentPart)}</span>` : '';
      return highlightedLabel + highlightedRest + highlightedComment;
    }

    // Handle directives (lines starting with .)
    const directiveMatch = codePart.match(/^(\s*)(\.[a-zA-Z_][a-zA-Z0-9_]*)(.*)/);
    if (directiveMatch) {
      const [, leadingWhitespace, directive, restOfLine] = directiveMatch;
      const highlightedDirective = `${leadingWhitespace}<span class="syntax-directive">${directive}</span>`;
      const highlightedRest = highlightDirectiveArguments(restOfLine);
      const highlightedComment = commentPart ? `<span class="syntax-comment">${escapeHtml(commentPart)}</span>` : '';
      return highlightedDirective + highlightedRest + highlightedComment;
    }

    // Handle regular instructions
    const highlightedCode = highlightCodeTokens(codePart);
    const highlightedComment = commentPart ? `<span class="syntax-comment">${escapeHtml(commentPart)}</span>` : '';

    return highlightedCode + highlightedComment;
  }

  function highlightCodeTokens(codeLine) {
    if (!codeLine.trim()) return codeLine;

    // Split on whitespace and commas, but preserve them
    const tokens = codeLine.split(/(\s+|,|\(|\))/);
    let result = '';
    let isFirstToken = true;

    for (let i = 0; i < tokens.length; i++) {
      const token = tokens[i];

      if (!token.trim()) {
        result += token;
        continue;
      }

      if (token === ',' || token === '(' || token === ')') {
        result += token;
        continue;
      }

      // First non-whitespace token is likely the instruction
      if (isFirstToken && token.trim()) {
        result += highlightInstruction(token);
        isFirstToken = false;
      } else {
        result += highlightOperand(token);
      }
    }

    return result;
  }

  function highlightInstruction(instruction) {
    const inst = instruction.toLowerCase().trim();

    // R-Type instructions
    const rTypeInstructions = ['add', 'sub', 'slt', 'sltu', 'sll', 'srl', 'sra', 'or', 'and', 'xor', 'mv', 'jr', 'jalr'];
    if (rTypeInstructions.includes(inst)) {
      return `<span class="syntax-r-type">${escapeHtml(instruction)}</span>`;
    }

    // I-Type instructions
    const iTypeInstructions = ['addi', 'slti', 'sltui', 'ori', 'andi', 'xori', 'li', 'slli', 'srli', 'srai'];
    if (iTypeInstructions.includes(inst)) {
      return `<span class="syntax-i-type">${escapeHtml(instruction)}</span>`;
    }

    // B-Type instructions (branch)
    const bTypeInstructions = ['beq', 'bne', 'bz', 'bnz', 'blt', 'bge', 'bltu', 'bgeu'];
    if (bTypeInstructions.includes(inst)) {
      return `<span class="syntax-b-type">${escapeHtml(instruction)}</span>`;
    }

    // S-Type instructions (store)
    const sTypeInstructions = ['sb', 'sw'];
    if (sTypeInstructions.includes(inst)) {
      return `<span class="syntax-s-type">${escapeHtml(instruction)}</span>`;
    }

    // L-Type instructions (load)
    const lTypeInstructions = ['lb', 'lw', 'lbu'];
    if (lTypeInstructions.includes(inst)) {
      return `<span class="syntax-l-type">${escapeHtml(instruction)}</span>`;
    }

    // J-Type instructions (jump)
    const jTypeInstructions = ['j', 'jal'];
    if (jTypeInstructions.includes(inst)) {
      return `<span class="syntax-j-type">${escapeHtml(instruction)}</span>`;
    }

    // U-Type instructions
    const uTypeInstructions = ['lui', 'auipc'];
    if (uTypeInstructions.includes(inst)) {
      return `<span class="syntax-u-type">${escapeHtml(instruction)}</span>`;
    }

    // SYS-Type instructions
    const sysTypeInstructions = ['ecall', 'halt'];
    if (sysTypeInstructions.includes(inst)) {
      return `<span class="syntax-sys-type">${escapeHtml(instruction)}</span>`;
    }

    // Pseudo instructions
    const pseudoInstructions = ['li16', 'la', 'push', 'pop', 'call', 'ret', 'inc', 'dec', 'neg', 'not', 'clr', 'nop'];
    if (pseudoInstructions.includes(inst)) {
      return `<span class="syntax-pseudo">${escapeHtml(instruction)}</span>`;
    }

    // Unknown instruction - just return as is
    return escapeHtml(instruction);
  }

  function highlightOperand(operand) {
    const trimmed = operand.trim();

    // Register names
    const registers = ['x0', 'x1', 'x2', 'x3', 'x4', 'x5', 'x6', 'x7', 't0', 'ra', 'sp', 's0', 's1', 't1', 'a0', 'a1', 'zero'];
    if (registers.includes(trimmed.toLowerCase())) {
      return `<span class="syntax-register">${escapeHtml(operand)}</span>`;
    }

    // Immediate values (numbers, hex, binary, octal)
    if (/^-?\d+$/.test(trimmed) ||
            /^0x[0-9a-fA-F]+$/.test(trimmed) ||
            /^0b[01]+$/.test(trimmed) ||
            /^0o[0-7]+$/.test(trimmed)) {
      return `<span class="syntax-immediate">${escapeHtml(operand)}</span>`;
    }

    // String literals
    if (trimmed.startsWith('"') && trimmed.endsWith('"')) {
      return `<span class="syntax-string">${escapeHtml(operand)}</span>`;
    }

    // Labels/symbols (alphanumeric identifiers)
    if (/^[a-zA-Z_][a-zA-Z0-9_]*$/.test(trimmed)) {
      return `<span class="syntax-label">${escapeHtml(operand)}</span>`;
    }

    // Default - no highlighting
    return escapeHtml(operand);
  }

  function highlightDirectiveArguments(args) {
    if (!args.trim()) return args;

    // Split on whitespace and commas, but preserve them
    const tokens = args.split(/(\s+|,)/);
    let result = '';

    for (let i = 0; i < tokens.length; i++) {
      const token = tokens[i];

      if (!token.trim() || token === ',') {
        result += token;
        continue;
      }

      // Highlight directive arguments
      result += highlightDirectiveArgument(token);
    }

    return result;
  }

  function highlightDirectiveArgument(arg) {
    const trimmed = arg.trim();

    // Numbers
    if (/^-?\d+$/.test(trimmed) ||
            /^0x[0-9a-fA-F]+$/.test(trimmed) ||
            /^0b[01]+$/.test(trimmed) ||
            /^0o[0-7]+$/.test(trimmed)) {
      return `<span class="syntax-immediate">${escapeHtml(arg)}</span>`;
    }

    // String literals
    if (trimmed.startsWith('"') && trimmed.endsWith('"')) {
      return `<span class="syntax-string">${escapeHtml(arg)}</span>`;
    }

    // Symbols
    if (/^[a-zA-Z_][a-zA-Z0-9_]*$/.test(trimmed)) {
      return `<span class="syntax-label">${escapeHtml(arg)}</span>`;
    }

    return escapeHtml(arg);
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // ECALL Input Handling Functions
  function checkForEcallInput(output) {
    const lines = output.split('\n');

    for (const line of lines) {
      const trimmedLine = line.trim();

      // Check for ECALL service 1 (string input)
      if (trimmedLine === "Enter string:") {
        showInputInterface("Enter a string:", "text", 1);
        return;
      }

      // Check for ECALL service 2 (number input)
      if (trimmedLine === "Enter number:") {
        showInputInterface("Enter a number:", "number", 2);
        return;
      }

      // Check for ECALL service 7 (keyboard input)
      if (trimmedLine === "Press key:") {
        showInputInterface("Press a key:", "char", 7);
        return;
      }
    }
  }

  function showInputInterface(promptText, inputType, serviceNumber) {
    const inputContainer = document.getElementById('console-input-container');
    const inputPrompt = document.getElementById('input-prompt');
    const consoleInput = document.getElementById('console-input');

    // Set the prompt text
    inputPrompt.textContent = promptText;

    // Configure input field based on type
    if (inputType === "number") {
      consoleInput.type = "number";
      consoleInput.placeholder = "Enter a number...";
    } else if (inputType === "char") {
      consoleInput.type = "text";
      consoleInput.placeholder = "Press a key...";
      consoleInput.maxLength = 1;
    } else {
      consoleInput.type = "text";
      consoleInput.placeholder = "Enter text...";
      consoleInput.maxLength = null;
    }

    // Clear previous input and show the interface
    consoleInput.value = "";
    inputContainer.style.display = "block";

    // Mark awaiting ECALL input and disable controls while waiting
    awaitingEcall = true;
    setButtonState('step-btn', 'pause', 'Waiting for input…', true);
    if (isStepMode) {
      setButtonState('run-btn', 'play', 'Run', true);
      setButtonState('step-mode-btn', 'pause', 'Step Mode Active', true);
    } else {
      setButtonState('run-btn', 'square', 'Stop', false);
      setButtonState('step-mode-btn', 'step-forward', 'Step Mode', true);
      isRunModeActive = true;
    }

    // Focus the input field
    setTimeout(() => {
      consoleInput.focus();
    }, 100);

    // Store service number for later use
    inputContainer.dataset.serviceNumber = serviceNumber;
    inputContainer.dataset.inputType = inputType;

    // Automatically switch to console tab if not already active
    const consoleTab = document.querySelector('[data-tab="console"]');
    if (consoleTab && !consoleTab.classList.contains('active')) {
      consoleTab.click();
    }
  }

  function hideInputInterface() {
    const inputContainer = document.getElementById('console-input-container');
    inputContainer.style.display = "none";
  }

  async function submitInput() {
    const inputContainer = document.getElementById('console-input-container');
    const consoleInput = document.getElementById('console-input');
    const serviceNumber = parseInt(inputContainer.dataset.serviceNumber);
    const inputType = inputContainer.dataset.inputType;
    const inputValue = consoleInput.value;

    // Validate input based on type
    if (inputType === "number" && (isNaN(inputValue) || inputValue.trim() === "")) {
      alert("Please enter a valid number");
      consoleInput.focus();
      return;
    }

    if (inputType === "char" && inputValue.length !== 1) {
      alert("Please enter exactly one character");
      consoleInput.focus();
      return;
    }

    if (inputType === "text" && inputValue.trim() === "") {
      alert("Please enter some text");
      consoleInput.focus();
      return;
    }

    // Hide the input interface but keep awaitingEcall=true until backend confirms processing
    hideInputInterface();

    // Maintain consistent "running" state for run mode during input submission
    if (!isStepMode) {
      setButtonState('run-btn', 'square', 'Stop', false);
      setButtonState('step-mode-btn', 'step-forward', 'Step Mode', true);
      setButtonState('step-btn', 'pause', 'Running...', true);
      isRunModeActive = true;
    }
    try {
      // Send the input to the backend
      const response = await fetch('https://codez16.up.railway.app/ecall_input', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ service: serviceNumber, input: inputValue })
      });

      if (response.ok) {
        const data = await response.json();

        // Check simulation state
        const ended = !!(data.output && (data.output.includes('Simulation ended.') || data.simulationEnded));
        const hasPromptNow = (document.getElementById('console-input-container').style.display !== 'none') || !!document.querySelector('#console-output .console-prompt');
        const canContinue = !ended && !!data.ecall_completed && !hasPromptNow;

        if (ended) {
          // Simulation ended - reset all buttons
          awaitingEcall = false;
          isStepMode = false; // Clear step mode flag when simulation ends
          setButtonState('run-btn', 'play', 'Run', false);
          setButtonState('step-mode-btn', 'step-forward', 'Step Mode', false);
          setButtonState('step-btn', 'check', 'Step (Done)', true);
        } else if (canContinue) {
          // ECALL completed, can continue execution
          awaitingEcall = false;
          if (isStepMode) {
            // Step mode can continue stepping
            setButtonState('run-btn', 'play', 'Run', false);
            setButtonState('step-mode-btn', 'pause', 'Step Mode Active', false);
            setButtonState('step-btn', 'skip-forward', 'Step', false);
          } else {
            // Run mode continues running - keep showing running state until truly done
            setButtonState('run-btn', 'square', 'Running...', true);
            setButtonState('step-mode-btn', 'step-forward', 'Step Mode', true);
            setButtonState('step-btn', 'pause', 'Running...', true);
          }
        } else {
          // Still waiting for more input or other conditions
          if (isStepMode) {
            setButtonState('step-btn', 'pause', 'Waiting for input…', true);
            setButtonState('step-mode-btn', 'pause', 'Step Mode Active', true);
            setButtonState('run-btn', 'play', 'Run', true);
          } else {
            setButtonState('run-btn', 'square', 'Running (waiting for input)...', true);
            setButtonState('step-mode-btn', 'step-forward', 'Step Mode', true);
            setButtonState('step-btn', 'pause', 'Waiting for input…', true);
          }
        }

        // Update IDE with new data
        if (data.registers || data.memory || data.instruction_log || data.output) {
          updateIDE(data);
        }
      } else {
        console.error('Failed to send ECALL input:', response.statusText);
        alert('Failed to send input to simulator');
        // Keep current waiting state on error
      }
    } catch (error) {
      console.error('Error sending ECALL input:', error);
      alert('Error communicating with simulator');
      // Keep current waiting state on error
    }
  }

  function cancelInput() {
    hideInputInterface();
    // Reset awaiting state but keep simulator in its current state
    awaitingEcall = false;

    // Reset button states based on current mode
    if (isStepMode) {
      setButtonState('run-btn', 'play', 'Run', false);
      setButtonState('step-mode-btn', 'pause', 'Step Mode Active', false);
      setButtonState('step-btn', 'skip-forward', 'Step', false);
    } else {
      // In run mode, keep running state until program exits
      setButtonState('run-btn', 'square', 'Running...', true);
      setButtonState('step-mode-btn', 'step-forward', 'Step Mode', true);
      setButtonState('step-btn', 'skip-forward', 'Step', true);
    }
  }

  // Also adjust the (older) input UI helper to reflect correct run-mode state

  // Inline console prompt helpers
  function hideConsolePrompt() {
    const prompt = document.querySelector('#console-output .console-prompt');
    if (prompt) prompt.remove();
  }
  function cancelInlinePrompt() {
    hideConsolePrompt();
    // Keep awaitingEcall=true; simulator is still waiting
    awaitingEcall = true;
    setButtonState('step-btn', 'pause', 'Waiting for input…', true);
    setButtonState('run-btn', 'play', 'Run', true);
    setButtonState('step-mode-btn', 'pause', 'Step Mode Active', true);
  }
  function showConsolePrompt(promptText, serviceNumber) {
    const consoleOutput = document.getElementById('console-output');
    hideConsolePrompt();
    const prompt = document.createElement('div');
    prompt.className = 'console-prompt';
    const label = document.createElement('span');
    label.className = 'prompt-label';
    label.textContent = promptText || 'Input:';
    const input = document.createElement('span');
    input.className = 'console-prompt-input';
    input.setAttribute('contenteditable', 'true');
    input.setAttribute('spellcheck', 'false');
    input.dataset.service = String(serviceNumber);
    input.addEventListener('keydown', async (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const value = input.textContent || '';
        if (serviceNumber === 2 && (value.trim() === '' || isNaN(value))) { alert('Please enter a valid number'); return; }
        if (serviceNumber === 7 && value.length < 1) { alert('Please press a key'); return; }
        await sendEcallInput(serviceNumber, value);
      } else if (e.key === 'Escape') {
        e.preventDefault();
        cancelInlinePrompt();
      } else if (serviceNumber === 7) {
        // limit to single character
        setTimeout(() => { if ((input.textContent || '').length > 1) { input.textContent = input.textContent.charAt(0); placeCaretAtEnd(input); } }, 0);
      }
    });
    prompt.appendChild(label);
    prompt.appendChild(input);
    consoleOutput.appendChild(prompt);

    // Mark awaiting ECALL input and disable controls while waiting
    awaitingEcall = true;
    setButtonState('step-btn', 'pause', 'Waiting for input…', true);
    if (isStepMode) {
      setButtonState('run-btn', 'play', 'Run', true);
      setButtonState('step-mode-btn', 'pause', 'Step Mode Active', true);
    } else {
      // Keep Stop clickable during input
      setButtonState('run-btn', 'square', 'Stop', false);
      setButtonState('step-mode-btn', 'step-forward', 'Step Mode', true);
      isRunModeActive = true;
    }

    setTimeout(() => { input.focus(); placeCaretAtEnd(input); consoleOutput.scrollTop = consoleOutput.scrollHeight; }, 0);
  }
  async function sendEcallInput(serviceNumber, inputValue) {
    try {
      const consoleOutput = document.getElementById('console-output');
      const prompt = consoleOutput.querySelector('.console-prompt');
      if (prompt) {
        const echo = document.createElement('div');
        echo.textContent = prompt.querySelector('.console-prompt-input')?.textContent || '';
        consoleOutput.insertBefore(echo, prompt);
      }
      hideConsolePrompt();
      const response = await fetch('https://codez16.up.railway.app/ecall_input', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ service: serviceNumber, input: inputValue })
      });
      if (!response.ok) {
        alert('Failed to send input to simulator');
        // Keep awaitingEcall=true and keep controls disabled
        setButtonState('step-btn', 'pause', 'Waiting for input…', true);
        if (isStepMode) {
          setButtonState('run-btn', 'play', 'Run', true);
          setButtonState('step-mode-btn', 'pause', 'Step Mode Active', true);
        } else {
          setButtonState('run-btn', 'square', 'Running (waiting for input)...', true);
          setButtonState('step-mode-btn', 'step-forward', 'Step Mode', true);
        }
        return;
      }
      const data = await response.json();
      const ended = !!(data.output && data.output.includes('Simulation ended.'));
      const hasPromptNow = (document.getElementById('console-input-container').style.display !== 'none') || !!document.querySelector('#console-output .console-prompt');
      const canStep = !ended && !!data.ecall_completed && !hasPromptNow;

      if (canStep) {
        awaitingEcall = false;
        if (isStepMode) {
          setButtonState('step-btn', 'skip-forward', 'Step', false);
          setButtonState('step-mode-btn', 'pause', 'Step Mode Active', false);
          setButtonState('run-btn', 'play', 'Run', false);
        } else {
          // Stay in running state
          setButtonState('run-btn', 'square', 'Stop', false);
          setButtonState('step-mode-btn', 'step-forward', 'Step Mode', true);
          setButtonState('step-btn', 'skip-forward', 'Step', true);
          isRunModeActive = true;
        }
      } else {
        // Still waiting for input or ended
        setButtonState('step-btn', 'pause', 'Waiting for input…', true);
        if (!ended && !isStepMode) {
          setButtonState('run-btn', 'square', 'Stop', false);
          setButtonState('step-mode-btn', 'step-forward', 'Step Mode', true);
          isRunModeActive = true;
        }
      }

      // UPDATE: Apply state in run mode as well
      if (data.registers || data.memory || data.instruction_log) {
        updateIDE(data);
      }
    } catch (err) {
      console.error('Error sending ECALL input:', err);
      alert('Error communicating with simulator');
      // Keep awaitingEcall=true; do not re-enable step to prevent crashes
      setButtonState('step-btn', 'pause', 'Waiting for input…', true);
      if (isStepMode) {
        setButtonState('run-btn', 'play', 'Run', true);
        setButtonState('step-mode-btn', 'pause', 'Step Mode Active', true);
      } else {
        setButtonState('run-btn', 'square', 'Running (waiting for input)...', true);
        setButtonState('step-mode-btn', 'step-forward', 'Step Mode', true);
      }
    }
  }

  // Detect ECALL prompts and show inline prompt (fallback to existing UI if needed)
  function checkForEcallInput(output) {
    const lines = output.split('\n');
    for (const line of lines) {
      const t = line.trim();
      if (t === 'Enter string:') { showConsolePrompt('Enter string:', 1); return; }
      if (t === 'Enter number:') { showConsolePrompt('Enter number:', 2); return; }
      if (t === 'Press key:') { showConsolePrompt('Press key:', 7); return; }
    }
  }

  // Add Tab key support in the code editor (indent/unindent), without breaking Ctrl/Arrow keys
  function handleEditorTab(editor, isShift) {
    const value = editor.value;
    const start = editor.selectionStart;
    const end = editor.selectionEnd;
    const hasSelection = start !== end;

    // Single-caret case: insert/remove indent on current line
    if (!hasSelection) {
      if (!isShift) {
        const newValue = value.slice(0, start) + "\t" + value.slice(end);
        editor.value = newValue;
        const caret = start + 1;
        editor.setSelectionRange(caret, caret);
      } else {
        // Unindent current line if it starts with a tab or two spaces
        const lineStart = value.lastIndexOf('\n', Math.max(0, start - 1)) + 1;
        let remove = 0;
        if (value.slice(lineStart, lineStart + 1) === '\t') remove = 1;
        else if (value.slice(lineStart, lineStart + 2) === '  ') remove = 2;
        if (remove > 0) {
          const newValue = value.slice(0, lineStart) + value.slice(lineStart + remove);
          const delta = -remove;
          const newCaret = Math.max(lineStart, start + delta);
          editor.value = newValue;
          editor.setSelectionRange(newCaret, newCaret);
        }
      }
      // Refresh views
      updateLineNumbers();
      updateLineCount();
      highlightSyntax();
      syncLineNumbersScroll();
      return;
    }

    // Block selection: indent/unindent each line in the selection
    const selStartLine = value.lastIndexOf('\n', Math.max(0, start - 1)) + 1;
    // End of selection: include full last line if caret sits at its start? keep as-is
    const before = value.slice(0, selStartLine);
    const block = value.slice(selStartLine, end);
    const after = value.slice(end);

    let changedBlock = block;
    if (!isShift) {
      // Indent every line in block
      changedBlock = block.replace(/^/gm, '\t');
      const newStart = start + 1; // first line gained 1 char
      const added = (block.match(/\n/g) || []).length + 1; // lines in block
      const newEnd = end + added;
      editor.value = before + changedBlock + after;
      editor.setSelectionRange(newStart, newEnd);
    } else {
      // Unindent: remove one leading tab or up to two spaces per line
      let removedOnFirst = 0;
      const unindented = block.replace(/^(\t| {1,2})/gm, (m, p1, offset) => {
        if (offset === 0) removedOnFirst = p1.length;
        return '';
      });
      // Count how many lines had something removed (for end position)
      const removedPerLine = (block.match(/^(\t| {1,2})/gm) || []).length;
      editor.value = before + unindented + after;
      const newStart = Math.max(selStartLine, start - removedOnFirst);
      const newEnd = Math.max(newStart, end - removedPerLine); // approximate
      editor.setSelectionRange(newStart, newEnd);
    }

    updateLineNumbers();
    updateLineCount();
    highlightSyntax();
    syncLineNumbersScroll();
  }

  // Global keydown handler to capture Tab in code editors only
  document.addEventListener('keydown', function(e) {
    const target = e.target;
    if (!target || !target.classList || !target.classList.contains('code-editor')) return;
    // Let OS/browser shortcuts work (copy/paste/arrows/undo/redo)
    if (e.ctrlKey || e.metaKey) return;
    if (e.key === 'Tab') {
      e.preventDefault();
      handleEditorTab(target, e.shiftKey);
    }
  });
