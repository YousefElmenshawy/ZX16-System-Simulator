<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ZX16 Web IDE</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #181c20;
      color: #e0e0e0;
      margin: 0;
      padding: 0;
    }
    .container {
      display: flex;
      max-width: 1200px;
      margin: 2rem auto;
      background: #23272e;
      border-radius: 12px;
      box-shadow: 0 4px 24px #0008;
      overflow: hidden;
    }
    .main {
      flex: 2;
      padding: 2rem;
    }
    .sidebar {
      flex: 1;
      background: #20232a;
      padding: 2rem 1rem;
      border-left: 1px solid #333;
      min-width: 320px;
    }
    textarea {
      width: 100%;
      font-family: 'Fira Mono', monospace;
      font-size: 1rem;
      background: #181c20;
      color: #e0e0e0;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 0.5rem;
      margin-bottom: 1rem;
      resize: vertical;
    }
    button {
      background: #4e8cff;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.5rem 1.5rem;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #2563eb;
    }
    h2, h3 {
      margin-top: 0;
    }
    .reg-table, .mem-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 1.5rem;
      background: #23272e;
      border-radius: 8px;
      overflow: hidden;
    }
    .reg-table th, .reg-table td, .mem-table th, .mem-table td {
      border: 1px solid #333;
      padding: 0.3rem 0.6rem;
      text-align: left;
      font-family: 'Fira Mono', monospace;
    }
    .reg-table th, .mem-table th {
      background: #181c20;
      color: #8ecfff;
    }
    .mem-table {
      font-size: 0.95em;
      max-height: 250px;
      overflow-y: auto;
      display: block;
    }
    .mem-table tbody {
      display: block;
      max-height: 200px;
      overflow-y: auto;
    }
    .mem-table tr {
      display: table;
      width: 100%;
      table-layout: fixed;
    }
    pre#output {
      background: #181c20;
      color: #e0e0e0;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 1rem;
      min-height: 80px;
      margin-bottom: 1.5rem;
      font-size: 1rem;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="main">
      <h2>ZX16 Web IDE</h2>
      <form id="zx16-form">
        <label for="asm">Enter ZX16 Assembly Code:</label><br>
        <textarea id="asm" rows="10" placeholder="li s0, 5&#10;li s1, 0&#10;..."></textarea><br>
        <button type="submit">Assemble & Simulate</button>
      </form>
      <h3>Output:</h3>
      <pre id="output"></pre>
    </div>
    <div class="sidebar">
      <h3>Registers</h3>
      <table class="reg-table" id="reg-table">
        <thead><tr><th>Register</th><th>Value</th></tr></thead>
        <tbody></tbody>
      </table>
      <h3>Memory (first 256 bytes)</h3>
      <table class="mem-table" id="mem-table">
        <thead><tr><th>Address</th><th>Bytes</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
  <script>
    async function updateIDE(data) {
      // Output
      document.getElementById("output").textContent = data.output || "";
      // Registers
      const regTable = document.getElementById("reg-table").querySelector("tbody");
      regTable.innerHTML = "";
      if (data.registers) {
        Object.entries(data.registers).forEach(([reg, val]) => {
          const row = document.createElement("tr");
          row.innerHTML = `<td>${reg}</td><td>${val}</td>`;
          regTable.appendChild(row);
        });
      }
      // Memory
      const memTable = document.getElementById("mem-table").querySelector("tbody");
      memTable.innerHTML = "";
      if (data.memory && data.memory.length > 0) {
        data.memory.slice(0, 16).forEach(memRow => {
          const row = document.createElement("tr");
          row.innerHTML = `<td>${memRow.address}</td><td>${memRow.bytes.join(" ")}</td>`;
          memTable.appendChild(row);
        });
      }
    }
    document.getElementById("zx16-form").addEventListener("submit", async function(e) {
      e.preventDefault();
      const code = document.getElementById("asm").value;
      const response = await fetch("http://127.0.0.1:8000/simulate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code })
      });
      if (response.ok) {
        const data = await response.json();
        updateIDE(data);
      } else {
        const err = await response.json();
        document.getElementById("output").textContent = "Error: " + err.error;
      }
    });
  </script>
</body>
</html>
